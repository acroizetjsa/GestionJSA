name: TC Infos personal export

on:
  push:
    branches:
      - agent/tc-infos-personal-export
    paths:
      - '.github/workflows/tc-infos-personal-export.yml'
      - 'tools/tc_infos_export.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tc-infos-personal-export.yml'
      - 'tools/tc_infos_export.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 openpyxl

      - name: Export public vehicle data
        run: python tools/tc_infos_export.py --max-network-id 2200 --delay 0.8 --output tc_infos_vehicules.xlsx

      - name: Upload Excel
        uses: actions/upload-artifact@v4
        with:
          name: tc-infos-personal-export
          path: tc_infos_vehicules.xlsx
          if-no-files-found: error
          retention-days: 7

